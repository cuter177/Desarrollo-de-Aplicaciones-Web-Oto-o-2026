name: proyecto-final

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pf-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD=/opt/mssql-tools18/bin/sqlcmd; else SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi; $$SQLCMD -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./docker/api
    container_name: pf-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Proyecto Final}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: mssql
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-DevStudioDB}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_NAME: ${SESSION_NAME:-devstudio_session}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      SESSION_SAMESITE: ${SESSION_SAMESITE:-Lax}
      API_PREFIX: ${API_PREFIX:-/api/v1}
    volumes:
      - ./backEnd:/var/www/html
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: pf-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./appWeb:/usr/share/nginx/html:ro
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql_data:
