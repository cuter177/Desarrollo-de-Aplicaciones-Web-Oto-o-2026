<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function () {
      var tema = "dia";
      try {
        var guardado = localStorage.getItem("ds-tema");
        if (guardado === "noche" || guardado === "dia") {
          tema = guardado;
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          tema = "noche";
        }
        if (localStorage.getItem("ds-sesion") === "1") {
          document.documentElement.setAttribute("data-sesion", "1");
          var iniciales = localStorage.getItem("ds-iniciales") || "";
          if (/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{1,3}$/.test(iniciales)) {
            document.documentElement.style.setProperty("--user-initials", '"' + iniciales + '"');
          }
          var fotoSrc = localStorage.getItem("ds-foto-src") || "";
          if (fotoSrc.indexOf("data:image/jpeg;base64,") === 0 && fotoSrc.length < 100000) {
            document.documentElement.setAttribute("data-foto", "1");
            document.documentElement.style.setProperty("--user-foto", 'url("' + fotoSrc + '")');
          }
        }
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", tema);
    })();
  </script>
  <meta charset="utf-8">
