server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # La API vive en el contenedor PHP. Al usar el mismo origen,
    # las cookies de sesión funcionan sin configurar CORS.
    location /api/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Sitio estático del front. El HTML no se guarda: si no, el menú
    # viejo reaparece al cambiar de página.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # El HTML no se guarda y, al cargar cualquier página nueva,
    # se descarta la copia vieja que el navegador ya tenía (el menú de login).
    location ~* \.html$ {
        add_header Cache-Control "no-store";
        add_header Clear-Site-Data "\"cache\"";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store";
    }
}
